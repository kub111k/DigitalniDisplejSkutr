[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Automatická instalace knihoven (vyčištěno od zbytečných OLED knihoven)
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    mikalhart/TinyGPSPlus @ ^1.0.3
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0

; Nové nastavení pro velký displej ILI9488 480x320
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5    
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=27000000